<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{font-family:'Geist';src:url('../src/assets/fonts/geist-variable.woff2') format('woff2');font-weight:100 900}
  @font-face{font-family:'Geist Mono';src:url('../src/assets/fonts/geist-mono-variable.woff2') format('woff2');font-weight:100 900}

  /* ──────────────────────────────────────────────────────────────────────────
     SOCIAL CARD — 1200x630

     EVERY string on this card must come from the approved copy in
     src/data/content.ts. An earlier version of this file carried headline
     figures ("136 roles closed", "91% offer to joining", "500K+ talent
     network"), a geography line and service-line labels that were never
     supplied by the client. They had been removed from the site but survived
     here, which is the worst place for them to survive: this image is what
     LinkedIn, Slack and WhatsApp render when the site is shared, so the
     fabricated numbers travelled further than the page ever did.

     If a claim is not in content.ts, it does not belong on this card.
     ────────────────────────────────────────────────────────────────────────── */

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;
    background:#faf6ee;
    color:#0b2545;
    font-family:'Geist',sans-serif;
    font-feature-settings:"cv01" 1,"ss01" 1;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:72px 80px;
    position:relative;overflow:hidden;
  }
  /* the same hairline grid the hero uses, at the same 64px rhythm */
  .grid{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right,#e7dfd0 1px,transparent 1px),
      linear-gradient(to bottom,#e7dfd0 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 20%,transparent 78%);
  }
  .inner{position:relative}
  img.logo{height:52px;width:auto;display:block}
  h1{
    font-size:76px;line-height:1.02;letter-spacing:-0.042em;font-weight:500;
    max-width:17ch;
  }
  /* cyan into coral — the two ends of the accent family */
  .rule{height:3px;width:160px;background:linear-gradient(to right,#04688f,#bc4a30);margin-bottom:36px}
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    font-size:19px;color:#556073;
  }
  .label{
    font-family:'Geist Mono',monospace;font-size:14px;letter-spacing:.11em;
    text-transform:uppercase;color:#04688f;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="inner">
    <img class="logo" src="../src/assets/logo.png" alt="" />
  </div>

  <div class="inner">
    <div class="rule"></div>
    <!-- brand.tagline, verbatim -->
    <h1>Global hiring, built around people and context</h1>
  </div>

  <div class="inner foot">
    <!-- brand.fullName, verbatim -->
    <span>Kivitronics Consulting</span>
    <span class="label">Recruitment</span>
  </div>
</body>
</html>
